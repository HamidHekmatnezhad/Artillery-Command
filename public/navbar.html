<script>
    document.addEventListener("DOMContentLoaded", () => {
        fetch('/api/data') // request json file
            .then(response => response.json())
            .then(data => {
                document.getElementById("nav-home").innerText = data.navText.home;
                document.getElementById("nav-game").innerText = data.navText.game;
                document.getElementById("nav-leaderboard").innerText = data.navText.leaderboard;
                document.getElementById("nav-help").innerText = data.navText.help;
                document.getElementById("nav-about").innerText = data.navText.about;
            })
            .catch(error => console.error("Error loading JSON data:", error));
    });
</script>
