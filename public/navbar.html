<nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary">

    <div class="container">

        <a class="navbar-brand text-danger fw-bold" href="/index" id="nav-titel"></a>
        
        <button type="button" class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">

            <ul class="navbar-nav ms-auto">
                
                <li class="nav-item">
                    <a class="nav-link" href="/index" id="nav-home"></a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/game" id="nav-game"></a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/leaderboard" id="nav-leaderboard"></a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/help" id="nav-help"></a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/about" id="nav-about"></a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        fetch('/api/data') // request json file
            .then(response => response.json())
            .then(data => {
                document.getElementById("nav-titel").innerText = data.navText.titel;
                document.getElementById("nav-home").innerText = data.navText.home;
                document.getElementById("nav-game").innerText = data.navText.game;
                document.getElementById("nav-leaderboard").innerText = data.navText.leaderboard;
                document.getElementById("nav-help").innerText = data.navText.help;
                document.getElementById("nav-about").innerText = data.navText.about;
            })
            .catch(error => console.error("Error loading JSON data:", error));

        // Highlight active nav link based on current path
        const currentPath = window.location.pathname; // find current path (e.g., /index, /game, etc.)
        const navLinks = document.querySelectorAll('.nav-link'); // select all nav links
        
        navLinks.forEach(link => {
            const linkHref = link.getAttribute('href'); // get href of each link
            if (linkHref === currentPath) { 
                link.classList.add('active'); // add 'active' class to matching link
                }
        });

    });
</script>
