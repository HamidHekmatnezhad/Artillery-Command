<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artillery Command - Command Center</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="node_modules/bootstrap-icons/font/bootstrap-icons.css">
    
    <link rel="stylesheet" href="/css/style.css">

    <script language="JavaScript">
    </script>
    
</head>

<body class="bg-dark text-light">

{{NAVBAR}}

    <div class="container text-center mt-3">
        <h1 class="display-4" id="main-titel"></h1>
        <p class="lead" id="main-subtitel"></p>
        <button class="btn btn-danger btn-lg mt-3" id="start-btn"></button>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            
            fetch('/api/data') // request json file
                .then(response => response.json())
                .then(data => {
                    document.getElementById("main-titel").innerText = data.titel;
                    document.getElementById("main-subtitel").innerText = data.subtitel;
                    document.getElementById("start-btn").innerText = data.btnText;
                })
                .catch(error => console.error("Error loading JSON data:", error));
        });
    </script>

</body>
</html>
