<!DOCTYPE html>
<html lang="de">
<head>
    {{HEAD}}
</head>

<body class="bg-dark text-light">

    {{NAVBAR}}
    
    <!-- head and score-->
    <div class="container mt-3">
        <div class="d-flex justify-content-between align-items-center mt-2">
        <h1 class="text-warning" id="txt-titel"></h1>
        <h3 class="text-warning fw-bold " id="txt-score"><span id="txt-score-point" class="text-info">0</span></h3>
        </div>
        
        
        <div class="row mt-3">
            
            <!-- Map -->
            <div class="col-lg-8 col-md-12 "> <!-- map 8/12 in large monitor and 12/12 in small monitor (phone)-->
                <div class="card bg-dark border-secondary h-100">
                    <div class="card-body p-0 overflow-hidden" id="canvas-container">
                    </div>
                </div>
            </div>

            <!-- Chat -->
            <div class="col-lg-4 col-md-12"> <!-- chat 4/12 in large monitor and 12/12 in small monitor (phone)--> 
                <div class="card bg-dark border-secondary h-100">
                    <div class="card-header border-secondary text-success fw-bold">
                        <span class="fw-bold" id="header-funker"></span> 
                    </div>
                    <div class="card-body chat-history-container overflow-auto custom-height chatbox-scroll-edit">
                        <!-- Chat messages will be displayed here -->
                        <div class="small" id="chat-box">
                        </div>           
                        <!------------------------------------------>
                    </div>
                    <div class="card-footer border-secondary">
                        <div class="input-group">
                            <input type="text" id="chat-input" class="form-control bg-dark text-light border-secondary" placeholder="Type to Funker...">
                            <button class="btn btn-outline-success" id="btn-send"></button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
            
        <div class="row mt-3">
            <!-- artillery showcase -->
            <div class="col-lg-4 col-md-12"> <!-- artillery 6/12 in large monitor and 12/12 in small monitor (phone)-->
                <div class="card bg-dark border-secondary h-100">
                    <!-- <img src="./assets/images/artillery.png" alt="Artillery Unit" class="img-fluid h-100 w-100">         muted -->
                    <video id="artillery-video" class="h-100 w-100"  playsinline>
                        <source src="./assets/video/artillery_1.mp4" type="video/mp4">
                        Your browser does not support the video tag.
                    </video>
                    
                </div>
            </div>

            <!-- Controller -->
            <div class="col-lg-8 col-md-12">
                <div class="card bg-dark border-secondary h-100">
                    <div class="card-header border-secondary text-danger fw-bold">
                        <span class="fw-bold" id="header-controller"></span> 
                    </div>
                    <div class="card-body">
                        
                        <div class="row h-100 m-0">

                            <div class="col-6 mt-3"> 

                                <!-- x slider -->
                                <div class="row m-0">
                                    <div class="col-6">
                                        <label class="form-label text-warning small fw-bold" id="xaxis-label"></label>
                                    </div>
                                    <div class="col-6 text-end"> <span class="text-info small fw-bold" id="val-x">90</span></div>
                                </div>
                                <input type="range" id="input-x" class="form-range" min="35" max="145" value="90" oninput="document.getElementById('val-x').innerText = this.value">

                                <!-- y slider -->
                                <div class="row m-0">
                                    <div class="col-6">
                                        <label class="form-label text-warning small fw-bold" id="yaxis-label"></label>
                                    </div>
                                    <div class="col-6 text-end"><span class="text-info small fw-bold" id="val-y">1200</span></div>
                                </div>
                                <input type="range" id="input-y" class="form-range" min="800" max="1420" value="1200" oninput="document.getElementById('val-y').innerText = this.value">

                            </div>
                            
                            <!-- Ammo selector-->
                            <div class="col-6">
                                <div class="row h-100">
                                    
                                    <!-- 1. ammo HE Shell -->
                                    <div class="col-6">

                                        <input type="radio" class="btn-check" name="ammoType" id="ammo-he" value="0" autocomplete="off" checked>
                                        <label class="btn btn-outline-warning w-100 h-50 mb-1" for="ammo-he">
                                            <span class="fw-bold" id="ammo-1"></span>
                                            <br>
                                            <small id="ammo-1-info"></small>
                                        </label>
                                        
                                        <!-- 2. Ammo Shrapnel-->
                                        <input type="radio" class="btn-check" name="ammoType" id="ammo-shrapnel" value="1" autocomplete="off">
                                        <label class="btn btn-outline-warning w-100 h-50 mt-1" for="ammo-shrapnel">
                                            <span class="fw-bold " id="ammo-2"></span>
                                            <br>
                                            <small id="ammo-2-info"></small>
                                        </label>


                                    </div>

                                    <!-- btn fire -->
                                    <div class="col-6 ">
                                        <button class="btn btn-danger h-100 w-100" id="btn-fire">
                                            <span class="fs-4 fw-bold" id="btn-fire-text"></span>
                                        </button>
                                    </div>

                                </div>
                            </div>

                        </div>

                    </div>
                </div>
            </div>
        </div> 


         <div class="row mt-3">
            
            <!-- debug and cheat -->
            <div class="col-lg-4 col-md-12">
                <div class="card bg-dark border-secondary h-100">
                        <span class="card-header border-secondary text-warning fw-bold" id="debug-titel"></span>
                    <div class="card-body p-0">
                        <table class="table table-dark table-striped table-hover">
                            <thead>
                                <tr>
                                    <th id="table-head-option"></th>
                                    <th class="text-center" id="th-debug-2"></th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td id="td-debug-aim"></td>
                                    <td class="text-center">
                                        <div class="form-check form-switch d-inline-block">
                                            <input class="form-check-input" type="checkbox" id="switch-debug-aim">
                                        </div>
                                    </td>
                                </tr>
                                <tr>
                                    <td id="td-debug-hitbox"></td>
                                    <td class="text-center">
                                        <div class="form-check form-switch d-inline-block">
                                            <input class="form-check-input" type="checkbox" id="switch-hitbox">
                                        </div>
                                    </td>
                                </tr>
                                <tr>
                                    <td id="td-debug-reset"></td>
                                    <td class="text-center">
                                        <button class="btn btn-outline-danger py-0" id="btn-reset-game"></button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Artillery Fire Table -->
            <div class="col-lg-4 col-md-6">
                <div class="card bg-dark border-secondary h-100">
                    <div class="card-header border-secondary text-info fw-bold">
                        <span id="arti-fire-table-title"></span>
                        <span class="text-warning fs-8" id="arti-info"></span>
                    </div>
                    
                    <div class="card-body">
                        <table class="table table-dark table-striped table-hover text-center">
                            <thead>
                                <tr class="test-info">
                                    <th id="th-range"></th>
                                    <th id="th-eleva"></th>
                                </tr>  
                            </thead>
                            <tbody id="artillery-table-info"></tbody>
                        </table>

                    </div>
                    
                </div>
            </div>

            <!-- info about enemy-->
            <div class="col-lg-4 col-md-6">
                <div class="card bg-dark border-secondary h-100">
                    <div class="card-header border-secondary text-info fw-bold">
                        <span id="info-enemy-title"></span>
                    </div>

                    <div class="card-body">
                        <table class="table table-dark table-striped table-hover text-center">
                            <thead>
                                <tr class="test-info text-center">
                                    <th id="th-icon-enmey"></th>
                                    <th id="th-pos-enemy"></th>
                                    <th id="th-hp-enemy"></th>
                                    <th id="th-size-enemy"></th>
                                    <th id="th-score-enemy"></th>
                                </tr>  
                            </thead>
                            <tbody id="enemy-info-table"></tbody>
                        </table>
                    </div>
                    
                </div>
            </div>

        </div>

    </div>

    {{FOOTER}}

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            
            fetch('/api/content') // request json file
                .then(response => response.json())
                .then(data => {
                    document.getElementById("title-text").innerHTML = data.game.tabTitle;
                    document.getElementById("txt-titel").innerText = data.game.tabTitle;
                    document.getElementById("header-controller").innerText = data.game.controller;
                    document.getElementById("header-funker").innerText = data.game.funker;
                    document.getElementById("xaxis-label").innerText = data.game.xAxis;
                    document.getElementById("yaxis-label").innerText = data.game.yAxis;
                    document.getElementById("txt-score").innerHTML = data.game.txtScore + '<span id="txt-score-point" class="text-info">0</span>';
                    document.getElementById("btn-send").innerText = data.game.sendChat;
                    document.getElementById("ammo-1").innerText = data.game.ammo1Head;
                    document.getElementById("ammo-1-info").innerText = data.game.ammo1Detail;
                    document.getElementById("ammo-2").innerText = data.game.ammo2Head;
                    document.getElementById("ammo-2-info").innerText = data.game.ammo2Detail;
                    document.getElementById("btn-fire-text").innerText = data.game.btnFireTxt;
                    document.getElementById("debug-titel").innerText = data.game.debugTitle;
                    document.getElementById("table-head-option").innerText = data.game.thDebug1;
                    document.getElementById("th-debug-2").innerText = data.game.thDebug2;
                    document.getElementById("td-debug-aim").innerText = data.game.tdDebugAim;
                    document.getElementById("td-debug-hitbox").innerText = data.game.tdHitBox;
                    document.getElementById("td-debug-reset").innerText = data.game.tdResetGame; 
                    document.getElementById("btn-reset-game").innerText = data.game.btnTxtResetGame;
                    document.getElementById("arti-fire-table-title").innerText = data.game.artiFireTableTitle;
                    document.getElementById("arti-info").innerText = data.game.artiInfo;
                    document.getElementById("th-range").innerText = data.game.thRange;
                    document.getElementById("th-eleva").innerText = data.game.thElevation;
                    document.getElementById("info-enemy-title").innerText = data.game.infoEnemyTitle;
                    document.getElementById("th-icon-enmey").innerText = data.game.thIconEnemy;
                    document.getElementById("th-pos-enemy").innerText = data.game.thPosEnemy;
                    document.getElementById("th-hp-enemy").innerText = data.game.thHpEnemy;
                    document.getElementById("th-size-enemy").innerText = data.game.thSizeEnemy;
                    document.getElementById("th-score-enemy").innerText = data.game.thScoreEnemy;

                })
                .catch(error => console.error("Error loading JSON data:", error));
        });
    </script>

<!-- Scripts -->
<script src="/p5/p5.min.js"></script>
<!-- <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script> -->
<script src="/js/entities.js"></script>
<script src="/js/radioSystem.js"></script>
<script src="/js/game.js"></script>

</body>
</html>
